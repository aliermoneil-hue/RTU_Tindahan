<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RTU Tindahan – Campus Marketplace</title>
    <meta name="theme-color" content="#0e2f5a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,body{background-color:#f2f5f9}
      html[data-theme='dark'],html[data-theme='dark'] body{background-color:#16171a}
    </style>
    <!-- Apply the saved light/dark theme before React loads (prevents a flash) -->
    <script>
      try {
        const stored = localStorage.getItem('rtu_theme')
        const resolved =
          stored === 'dark' || stored === 'light'
            ? stored
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.setAttribute('data-theme', resolved)
        const meta = document.querySelector('meta[name="theme-color"]')
        if (meta) {
          meta.setAttribute('content', resolved === 'dark' ? '#121417' : '#0e2f5a')
        }
      } catch (e) {}
    </script>
  </head>
  <body style="margin: 0; min-height: 100vh; height: auto;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
